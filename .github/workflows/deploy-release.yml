name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  DEPLOY_TARGET: production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Checkout production repository
        run: |
          git clone git@github.com:zengruppe-linz/production.git production

      - name: Copy build to production repository
        run: |
          rm -rf production/*
          cp -R dist/. production/
          touch production/.nojekyll
          echo "zengruppe-linz.at" > production/CNAME

      - name: Commit and push production
        run: |
          cd production

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy release ${{ github.event.release.tag_name }}"
          git push origin main
