name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_TARGET: staging

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Checkout staging repository
        run: |
          git clone git@github.com:zengruppe-linz/staging.git staging

      - name: Copy build to staging repository
        run: |
          rm -rf staging/*
          cp -R dist/. staging/
          touch staging/.nojekyll

      - name: Commit and push staging
        run: |
          cd staging

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy ${GITHUB_SHA}"
          git push origin main
